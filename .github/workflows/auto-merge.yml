# Mergea solo los PR que ya verificaron todo.
#
# POR QUE UN WORKFLOW PROPIO Y NO EL AUTO-MERGE NATIVO DE GITHUB
#
# El nativo solo actua cuando algo bloquea el PR: checks requeridos por la
# proteccion de rama. CosteAR-admin es privado y en plan free no admite
# proteccion, asi que ahi el nativo no gatea nada — mergearia al instante, con
# el CI en rojo o sin haber corrido. Este workflow verifica los checks el mismo,
# y por eso se comporta igual en los tres repos.
#
# LA REGLA DE MERGE
#
#   base dev      -> squash. Una rama de trabajo son N commits de ida y vuelta;
#                    en dev queremos una linea por unidad de trabajo.
#   base staging  -> merge commit. Promover no es trabajo nuevo: es mover un
#                    conjunto ya integrado, y el commit de merge deja registrado
#                    QUE tanda se promovio y cuando.
#   base main     -> NO se automatiza. Es produccion y hay un cliente real
#                    del otro lado. Lo mergea una persona.
#
# EL CONTROL: la etiqueta `auto-merge`
#
# Nada se mergea solo por estar en verde. Hace falta que alguien —Santiago, o
# Claude al revisar lo que volvio de un agente— le ponga la etiqueta. Es el
# punto donde entra el juicio humano, y es lo unico que separa "el CI paso" de
# "esto puede entrar".
name: Auto-merge

on:
  # El disparador principal: termino de correr una tanda de checks.
  check_suite:
    types: [completed]
  # Cubre el caso de etiquetar un PR que YA estaba en verde.
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  # Red de seguridad. `check_suite` se pierde de vez en cuando, y un PR
  # etiquetado y en verde que nadie mergea es peor que uno que falla: no avisa.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # `gh pr checks` arma el rollup con las tres: los check runs de Actions
  # (checks), los commit statuses de servicios externos como Vercel (statuses),
  # y los workflow runs (actions). Con solo `checks: read` el comando falla
  # entero y no devuelve nada.
  checks: read
  statuses: read
  actions: read

concurrency:
  # Dos corridas mergeando a la vez sobre la misma base se pisan.
  group: auto-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge:
    # El nombre importa: este job aparece como un check MAS en la lista del PR,
    # y hay que poder distinguirlo de los checks de verdad. Ver abajo.
    name: auto-merge (este mismo workflow)
    runs-on: ubuntu-latest
    steps:
      - name: Mergear lo que ya verifico todo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          pendientes=$(gh pr list --repo "$REPO" --state open --limit 50 \
            --json number,isDraft,labels,baseRefName,mergeStateStatus,title)

          echo "$pendientes" | jq -c '.[]' | while read -r pr; do
            n=$(jq -r '.number'         <<<"$pr")
            base=$(jq -r '.baseRefName' <<<"$pr")
            draft=$(jq -r '.isDraft'    <<<"$pr")
            estado=$(jq -r '.mergeStateStatus' <<<"$pr")
            titulo=$(jq -r '.title'     <<<"$pr")
            etiquetas=$(jq -r '[.labels[].name] | join(" ")' <<<"$pr")

            echo "::group::PR #$n — $titulo"
            echo "base=$base draft=$draft estado=$estado etiquetas=[$etiquetas]"

            if [ "$draft" = "true" ]; then
              echo "SALTEADO: es borrador."; echo "::endgroup::"; continue
            fi

            if ! grep -qw 'auto-merge' <<<"$etiquetas"; then
              echo "SALTEADO: sin la etiqueta auto-merge. Nada se mergea solo por estar en verde."
              echo "::endgroup::"; continue
            fi

            case "$base" in
              dev)     metodo="--squash" ;;
              staging) metodo="--merge"  ;;
              main)
                echo "SALTEADO: main es produccion y lo mergea una persona."
                echo "::endgroup::"; continue ;;
              *)
                echo "SALTEADO: base '$base' no esta contemplada."
                echo "::endgroup::"; continue ;;
            esac

            # LA VERIFICACION. En admin esto es lo UNICO que separa un merge
            # bueno de uno con el CI en rojo: no hay proteccion de rama que lo
            # frene despues.
            if [ "$estado" = "DIRTY" ]; then
              echo "SALTEADO: tiene conflictos. Los resuelve quien abrio el PR."
              echo "::endgroup::"; continue
            fi

            # PRIMERO SE MIRA SI ESTA AL DIA. DESPUES LOS CHECKS. EN ESE ORDEN.
            #
            # Al reves no funciona, y costo dos corridas descubrirlo: cuando la
            # base se mueve, GitHub recalcula el merge ref del PR y los check
            # runs viejos quedan huerfanos. `gh pr checks` pasa a decir "no
            # checks reported" sobre un PR que hace un minuto estaba en verde.
            # Preguntando por los checks primero, ese PR se reporta como "sin
            # checks" y no se toca nunca mas — cuando lo que en realidad
            # necesita es que le actualicen la rama para que vuelvan a correr.
            #
            # Los checks de un PR YA corren sobre el codigo integrado: GitHub
            # dispara `pull_request` sobre refs/pull/N/merge, que es la rama
            # mezclada con la base. Lo que hay que garantizar es que esa mezcla
            # sea contra la base de AHORA. Si no: dos PR verdes contra dev@X, se
            # mergea el primero, dev pasa a Y, y el segundo sigue mostrando un
            # verde que se calculo contra X. Entra y rompe dev.
            #
            # No se usa `mergeStateStatus == BEHIND` porque GitHub solo lo
            # reporta cuando una regla de proteccion exige estar al dia. Admin
            # no tiene proteccion: ahi devuelve CLEAN aunque el PR este viejo y
            # la guarda no dispararia nunca. Comparar las ramas anda igual en
            # los tres repos, con proteccion y sin ella.
            head_sha=$(gh pr view "$n" --repo "$REPO" --json headRefOid --jq .headRefOid)
            atras=$(gh api "repos/$REPO/compare/$base...$head_sha" --jq .behind_by 2>/dev/null || echo 0)

            if [ "${atras:-0}" -gt 0 ]; then
              echo "SALTEADO: atrasado $atras commit(s) respecto de $base."
              echo "Lo actualiza quien abrio el PR, no este workflow."

              # POR QUE EL WORKFLOW NO ACTUALIZA LA RAMA EL MISMO.
              #
              # Lo hacia, y no funcionaba. El commit que genera `update-branch`
              # lo firma `github-actions[bot]`, y GitHub deja las corridas de CI
              # de un bot en `action_required` esperando aprobacion manual. O
              # sea: la rama se actualizaba, el CI no corria nunca, y el PR
              # quedaba trabado en silencio para siempre. Peor que no hacer nada,
              # porque parecia que algo estaba pasando.
              #
              # La alternativa era un PAT de larga vida como secret en los tres
              # repos, para que el push quede a nombre de un usuario real. No
              # vale un token permanente ahorrar un comando.
              #
              # UN COMENTARIO POR SHA, NO UNO POR CORRIDA. Este workflow se
              # despierta con cada tanda de checks y ademas cada 15 minutos.
              # Sin guarda, un PR que pasa la noche atrasado amanece con
              # cuarenta comentarios iguales y el aviso deja de leerse.
              marca="<!-- auto-merge:atrasado:$head_sha -->"
              if gh pr view "$n" --repo "$REPO" --json comments --jq '.comments[].body' 2>/dev/null | grep -qF "$marca"; then
                echo "Ya estaba avisado para este SHA; no se repite el comentario."
              else
                # OJO CON LA INDENTACION.
                #
                # Este texto vive adentro de un bloque `run: |` de YAML, y toda
                # linea no vacia tiene que estar indentada al menos como el
                # bloque. La primera version escribia el cuerpo como un string
                # multilinea con el markdown pegado a la columna 0 — y eso
                # ROMPE EL YAML ENTERO: GitHub deja de poder parsear el archivo
                # y el workflow no corre mas.
                #
                # Y falla en silencio: las corridas aparecen como "failure"
                # colgadas de un push cualquiera, con el mensaje generico
                # "this run likely failed because of a workflow file issue", y
                # los PR se quedan CLEAN para siempre esperando a nadie.
                #
                # Por eso el cuerpo se arma con printf, una linea por argumento,
                # todas indentadas.
                cuerpo=$(printf '%s
'                   "$marca"                   "**Este PR esta atrasado $atras commit(s) respecto de \`$base\`, asi que todavia no se puede mergear.**"                   ""                   "Actualizalo y el auto-merge sigue solo:"                   ""                   "\`\`\`bash"                   "gh pr update-branch $n"                   "\`\`\`"                   ""                   "**Por que no alcanza el verde que ya tenias:** se calculo contra una version anterior de \`$base\`. Dos PR verdes contra el mismo \`$base\` viejo entran los dos, y el segundo puede romperlo."                   ""                   "**Por que no lo actualiza el workflow:** el commit que genera lo firma \`github-actions[bot]\`, y GitHub deja el CI de un bot esperando aprobacion manual. La rama se actualizaba, el CI no corria, y el PR quedaba trabado en silencio.")

                if gh pr comment "$n" --repo "$REPO" --body "$cuerpo" >/dev/null 2>&1; then
                  echo "Avisado en el PR."
                else
                  echo "No se pudo comentar. Queda solo en este log."
                fi
              fi

              echo "::endgroup::"; continue
            fi

            # LEER LOS CHECKS.
            #
            # `gh pr checks` no sirve para decidir por su codigo de salida:
            # devuelve distinto de cero cuando algo falla, cuando algo esta
            # pendiente Y cuando no hay ningun check — tres situaciones que acá
            # se resuelven distinto. Y con --json, cuando no hay checks, imprime
            # texto plano ("no checks reported on the 'x' branch") en vez de un
            # array vacio.
            #
            # Asi que se ignora el codigo de salida y se decide por la salida:
            # si parsea como JSON, son los checks; si no, es que no hay.
            salida=$(gh pr checks "$n" --repo "$REPO" --json name,bucket 2>&1 || true)

            if ! checks=$(jq -e -c '.' <<<"$salida" 2>/dev/null); then
              echo "SALTEADO: el PR no tiene ningun check. Cero checks no es verde."
              echo "Lo que devolvio el comando: $salida"
              echo "::endgroup::"; continue
            fi

            # ESTE WORKFLOW NO SE CUENTA A SI MISMO.
            #
            # Al dispararse por `pull_request`, este job aparece en la lista de
            # checks del PR — y siempre pasa, porque su trabajo es decidir, no
            # verificar. Contandolo, un PR que no dispara NINGUN CI tendria
            # igual un check en verde: el mio. La guarda de "cero checks no es
            # verde" quedaba anulada justamente por la cosa que la ejecuta.
            checks=$(jq -c '[.[] | select(.name != "auto-merge (este mismo workflow)")]' <<<"$checks")
            total=$(jq 'length' <<<"$checks")

            if [ "$total" -eq 0 ]; then
              echo "SALTEADO: el PR no tiene ningun check propio. Cero checks no es verde."
              echo "::endgroup::"; continue
            fi

            echo "$total check(s) propios encontrados."

            malos=$(jq -r '[.[] | select(.bucket != "pass" and .bucket != "skipping")] | length' <<<"$checks")
            if [ "$malos" -ne 0 ]; then
              echo "SALTEADO: hay $malos check(s) que no pasaron o siguen corriendo:"
              jq -r '.[] | select(.bucket != "pass" and .bucket != "skipping") | "  - \(.name): \(.bucket)"' <<<"$checks"
              echo "::endgroup::"; continue
            fi

            echo "Todo verificado. Mergeando a $base con $metodo."
            if gh pr merge "$n" --repo "$REPO" $metodo --delete-branch; then
              echo "MERGEADO #$n -> $base"
            else
              echo "FALLO el merge de #$n. Queda abierto para que lo mire una persona."
            fi
            echo "::endgroup::"
          done
