name: Backend CI

on:
  push:
    branches: [ "dev", "staging", "main" ]
  pull_request:
    branches: [ "dev", "staging", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Linter
      run: npm run lint
      
    - name: Prisma Generate
      run: npx prisma generate
      
    - name: Build
      run: npm run build
      
    - name: Run Tests
      run: npm run test

  # Aparte del job de arriba a propósito: estos tests necesitan una base
  # Postgres de verdad. El aislamiento entre empresas depende de RLS —políticas
  # que viven en Postgres, no en TypeScript— y de los filtros por userId de la
  # capa de aplicación. Con Prisma mockeado no se puede verificar ninguna de las
  # dos: un mock confirma que se llamó a findFirst con cierto where, no que la
  # base no devuelva las filas del otro inquilino.
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Misma imagen que docker-compose: la migración add_vault_chunks corre
        # CREATE EXTENSION vector y con un postgres:16 común falla.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: costear_test
          POSTGRES_USER: costear
          POSTGRES_PASSWORD: costear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U costear"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://costear:costear@localhost:5432/costear_test

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Prisma Generate
      run: npx prisma generate

    # El global-setup de la suite corre migrate-deploy y apply-rls contra
    # DATABASE_URL antes del primer test.
    - name: Run Integration Tests
      run: npm run test:integration
