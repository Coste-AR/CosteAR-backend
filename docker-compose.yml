services:
  postgres:
    # OBLIGATORIO: imagen con pgvector. La migración `add_vault_chunks` corre
    # `CREATE EXTENSION IF NOT EXISTS vector`; con una imagen `postgres:16` común
    # falla con `extension "vector" is not available` y bloquea TODA migración
    # nueva. Si tenés un contenedor viejo creado con otra imagen, recreálo:
    # `docker compose up -d postgres` (mantiene el volumen `postgres_data`).
    image: pgvector/pgvector:pg16
    container_name: costear-postgres
    environment:
      POSTGRES_DB: costear
      POSTGRES_USER: costear
      POSTGRES_PASSWORD: costear
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costear"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: costear-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
